<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | SoniaBot</title>
<link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
<main class="dashboard-page">
<section class="dashboard-panel" aria-live="polite">
<h1>Dashboard de SoniaBot</h1>
<div id="dashboardContent">Comprobando sesion...</div>
<section class="guilds-section" aria-labelledby="guildsTitle">
<h2 id="guildsTitle">Mis servidores</h2>
<div id="guildsList" class="guilds-list" aria-live="polite"></div>
</section>
<button id="logoutButton" type="button" hidden>Cerrar sesion</button>
</section>
</main>
<script>
const dashboardContent = document.querySelector("#dashboardContent");
const guildsList = document.querySelector("#guildsList");
const logoutButton = document.querySelector("#logoutButton");

async function loadDashboard() {
  try {
    const response = await fetch("/api/me", { credentials: "same-origin" });
    if (!response.ok) throw new Error("No autenticado");

    const { user } = await response.json();
    localStorage.setItem("soniabot.user", JSON.stringify(user));
    const avatar = document.createElement("img");
    avatar.className = "dashboard-avatar";
    avatar.src = user.avatarUrl;
    avatar.alt = `Avatar de ${user.globalName}`;

    const welcome = document.createElement("p");
    welcome.textContent = `Bienvenido, ${user.globalName}.`;
    dashboardContent.replaceChildren(avatar, welcome);

    const guilds = Array.isArray(user.guilds) ? user.guilds : [];
    guildsList.replaceChildren();
    if (!guilds.length) {
      const emptyMessage = document.createElement("p");
      emptyMessage.textContent = "No perteneces a ningun servidor.";
      guildsList.append(emptyMessage);
    } else {
      guilds.forEach((guild) => {
        const guildItem = document.createElement("article");
        guildItem.className = "guild-item";

        if (guild.iconUrl) {
          const guildIcon = document.createElement("img");
          guildIcon.src = guild.iconUrl;
          guildIcon.alt = `Icono de ${guild.name}`;
          guildItem.append(guildIcon);
        }

        const guildName = document.createElement("span");
        guildName.textContent = guild.name;
        guildItem.append(guildName);

        if (guild.owner) {
          const ownerLabel = document.createElement("small");
          ownerLabel.textContent = "Propietario";
          guildItem.append(ownerLabel);
        }

        guildsList.append(guildItem);
      });
    }
    logoutButton.hidden = false;
  } catch {
    localStorage.removeItem("soniabot.user");
    window.location.replace("/");
  }
}

logoutButton.addEventListener("click", async () => {
  await fetch("/auth/logout", { method: "POST", credentials: "same-origin" });
  localStorage.removeItem("soniabot.user");
  window.location.replace("/");
});

loadDashboard();
</script>
</body>
</html>
