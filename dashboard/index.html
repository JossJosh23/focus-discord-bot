<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | SoniaBot</title>
<link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
<header class="dashboard-navbar">
<a class="dashboard-brand" href="/">
<img src="/public/assets/logo1.png" alt="">
<span>Sonia Bot</span>
</a>

<div class="dashboard-actions">
<div class="server-selector" id="serverSelector">
<button class="server-selector-button" id="serverSelectorButton" type="button" aria-haspopup="listbox" aria-expanded="false">
<span id="selectedGuildIcon" class="guild-icon-placeholder" aria-hidden="true">S</span>
<span id="selectedGuildName">Seleccionar servidor</span>
<span aria-hidden="true">⌄</span>
</button>
<div id="guildsMenu" class="guilds-menu" role="listbox" aria-label="Servidores de Discord" hidden></div>
</div>

<div class="dashboard-user">
<img id="navbarUserAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="">
<span id="navbarUserName">Usuario</span>
</div>
</div>
</header>

<main class="dashboard-page">
<section class="dashboard-panel" aria-live="polite">
<h1>Dashboard de SoniaBot</h1>
<div id="dashboardContent">Comprobando sesion...</div>
<section class="guilds-section" aria-labelledby="guildsTitle">
<h2 id="guildsTitle">Mis servidores</h2>
<div id="guildsList" class="guilds-list" aria-live="polite"></div>
</section>
<button id="logoutButton" type="button" hidden>Cerrar sesion</button>
</section>
</main>
<script src="/public/js/dashboard.js"></script>
</body>
</html>
